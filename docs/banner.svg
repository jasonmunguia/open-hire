<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Open Hire — screen hundreds of resumes like a swipe app">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141417"/>
      <stop offset="55%" stop-color="#0C0C0E"/>
      <stop offset="100%" stop-color="#121013"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="118%" r="62%">
      <stop offset="0%" stop-color="#E0703A" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E0703A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E0703A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E0703A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E0703A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#ground)"/>
  <rect width="1200" height="340" rx="22" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="338.5" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Wordmark as two anchored words rather than one text with a tspan:
       a tspan inside a centre-anchored <text> advances inconsistently across
       renderers and the two words collide. -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
     font-size="92" font-weight="700">
    <text x="588" y="150" text-anchor="end" fill="#F5F4F2">OPEN</text>
    <text x="612" y="150" text-anchor="start" fill="#E0703A">HIRE</text>
  </g>

  <rect x="470" y="176" width="260" height="2" rx="1" fill="url(#rule)"/>

  <text x="600" y="212" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="15" letter-spacing="4.4" fill="#8A8A94">SWIPE-STYLE RESUME SCREENING</text>

  <!-- the four actions: the app's visual signature, in order, with labels -->
  <g transform="translate(378 250)">
    <!-- go back -->
    <circle cx="34" cy="26" r="24" fill="#17171B" stroke="#ffffff" stroke-opacity="0.10"/>
    <g stroke="#C9C9D2" stroke-width="2.1" fill="none" stroke-linecap="round" stroke-linejoin="round"
       transform="translate(23 15) scale(0.92)">
      <path d="M3 9h11a5 5 0 0 1 0 10h-3"/><path d="M7 5L3 9l4 4"/>
    </g>

    <!-- reject -->
    <circle cx="150" cy="26" r="27" fill="#1C1C20" stroke="#ffffff" stroke-opacity="0.10"/>
    <g stroke="#FFFFFF" stroke-width="2.9" stroke-linecap="round" transform="translate(137 13)">
      <path d="M5 5l16 16M21 5L5 21"/>
    </g>

    <!-- auto-bid -->
    <circle cx="264" cy="26" r="27" fill="#1C1C20" stroke="#ffffff" stroke-opacity="0.10"/>
    <path transform="translate(250 12) scale(1.15)" fill="#7BADEA"
          d="M12 2.6l2.9 5.9 6.5.95-4.7 4.6 1.1 6.45L12 17.45 6.2 20.5l1.1-6.45-4.7-4.6 6.5-.95z"/>

    <!-- next round -->
    <circle cx="410" cy="26" r="27" fill="#1C1C20" stroke="#ffffff" stroke-opacity="0.10"/>
    <path transform="translate(396 12) scale(1.15)" fill="#E5252D"
          d="M12 20.5l-1.4-1.3C5.4 14.5 2 11.4 2 7.7 2 4.7 4.4 2.4 7.4 2.4c1.7 0 3.3.8 4.6 2.2 1.3-1.4 2.9-2.2 4.6-2.2 3 0 5.4 2.3 5.4 5.3 0 3.7-3.4 6.8-8.6 11.5z"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="10.5" letter-spacing="1.8" fill="#7E7E88" text-anchor="middle">
      <text x="34" y="70">GO BACK</text>
      <text x="150" y="70">REJECT</text>
      <text x="264" y="70">AUTO-BID</text>
      <text x="410" y="70">NEXT ROUND</text>
    </g>
  </g>
</svg>
